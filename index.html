<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wist feuille de score</title>
    <link rel="stylesheet" href="./bulma.0.9.0.css">
	<link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="app" class="container grid-lg">
      <header class="page-header">
        <h1>Wist</h1>
        <div class="header-actions">
          <div class="share-wrap">
            <button
              type="button"
              class="reset-btn"
              :class="{ 'is-live': shareCode }"
              @click="shareOpen = !shareOpen"
            >
              {{ shareCode || 'Partager' }}
            </button>
            <div v-if="shareOpen" class="share-panel" @click.stop>
              <template v-if="shareCode">
                <p class="share-code">{{ shareCode }}</p>
                <p class="share-status">{{ shareStatusLabel }}</p>
                <div class="share-actions">
                  <button type="button" class="reset-btn" @click="copyShareCode">Copier</button>
                  <button type="button" class="reset-btn" @click="leaveShare">Quitter</button>
                </div>
              </template>
              <template v-else>
                <label class="share-label">
                  Code
                  <input
                    class="input share-input"
                    :value="joinDraft"
                    maxlength="12"
                    autocapitalize="off"
                    autocomplete="off"
                    spellcheck="false"
                    @input="joinDraft = $event.target.value"
                    @keydown.enter.prevent="joinShare"
                  >
                </label>
                <p v-if="shareStatusLabel" class="share-status">{{ shareStatusLabel }}</p>
                <div class="share-actions">
                  <button type="button" class="reset-btn" :disabled="shareStatus === 'connecting'" @click="joinShare">Rejoindre</button>
                  <button type="button" class="reset-btn" :disabled="shareStatus === 'connecting'" @click="createShare">Créer</button>
                </div>
              </template>
            </div>
          </div>
          <button
            type="button"
            class="reset-btn"
            @click="resetGame"
          >
            Réinitialiser
          </button>
        </div>
      </header>

	  <!--TABLE-->
	  <!--headers-->
      <table
        id="mainTable"
        class="table is-striped is-narrow is-bordered is-fullwidth"
        :style="{ '--players': players.length }"
      >
        <colgroup>
          <col class="col-tour" />
          <col
            v-for="(player, index) in players"
            :key="'col-' + index"
            class="col-player"
          />
        </colgroup>
        <thead>
          <tr>
            <th></th>
            <th
              v-for="(player, index) in players"
              :key="index"
              :class="{ 'is-winner-header': isWinner(index) }"
              @click="rotatePlayerName(index)"
            >
              <span class="player-name">{{ player }}</span>
              <span v-if="isWinner(index)" class="winner-chip">1er</span>
			  <button
				v-if="canRemovePlayer()"
				type="button"
				@click.stop="removePlayer(index)">
				&times;
			  </button>
            </th>
          </tr>
        </thead>

		<!--body-->
        <tbody>
         <tr
			v-for="(tour, tourIndex) in tours"
			:key="tour"
			:class="{
			  'has-background-info-light': tourIndex === tours.indexOf(currentTour),
			  	'has-text-grey-light': tour !== currentTour && !tourHasScore(tour)
			}"
		  >
			<td
			  class="has-text-weight-semibold is-clickable"
			  :class="{
				'has-text-info': tourIndex === tours.indexOf(currentTour),
				'has-text-grey-light': tour !== currentTour && !tourHasScore(tour)
			  }"
			  @click="selectCurrentTour(tourIndex)"
			>
			  {{ tour }}
			  
			</td>

            <td
              v-for="(player, playerIndex) in players"
              :key="playerIndex"
              :class="{
                'contrat-cell': tour === currentTour,
                'is-winner-score': gameFinished && tour === lastTour && isWinner(playerIndex)
              }"
              @click="tour === currentTour && openContractModal(playerIndex)"
            >
			   <span
			     v-if="isDealerCell(tourIndex, playerIndex)"
			     class="cell-triangle"
			   ></span>
               <div class="cell-values">
				<span class="cell-contrat">
				  {{ scores[tour][playerIndex].contrat ?? '' }}
				</span>				
				<span class="cell-score">
				  {{ scores[tour][playerIndex].score ?? '' }}
				</span>
				<span class="cell-plis" v-html="renderPlisCell(tour, playerIndex)">
				</span>
			  </div>
            </td>
          </tr>
        </tbody>
      </table>

	  <!--MODAL-->
      <contract-modal
		  ref="contractModal" 
		  :player-index="editingPlayerIndex"
		  :player="players[editingPlayerIndex]"
		  :tour="currentTour"
		  :current-tour-scores="scores[currentTour]"
		  @previous="previousContract"
		  @next="nextContract"
		  @update-contract="onContractInput"
		  @update-plis="onNombrePlisInput"
		  @close="onContractModalClose"
		/>
    </div>

	<script src="./ContractModal.js"></script>
    <script src="./vue.3.0.0-rc.10.js"></script>
    <script src="./urlState.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
